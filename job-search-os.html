<!DOCTYPE html>
<!-- 本工作台通过 WorkBuddy「资料库」skill 搭建与部署 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Job Search OS">
<title>Job Search OS V1.1 · 求职工作台与项目作品</title>
<style>
:root{
  --bg:#f4f6f9; --surface:#ffffff; --surface-2:#fafbfc; --surface-3:#f2f4f7;
  --border:#e4e7ec; --border-strong:#d0d5dd;
  --text:#101828; --text-2:#475467; --text-3:#98a2b3;
  --primary:#3b5bdb; --primary-weak:#eef2ff; --primary-strong:#2f49a8;
  --success:#12b76a; --success-weak:#e7f8f0;
  --warn:#f79009; --warn-weak:#fef4e6;
  --danger:#f04438; --danger-weak:#fee4e2;
  --purple:#7a5af8; --purple-weak:#f4f0ff;
  --cyan:#06aed4; --cyan-weak:#e0f5fb;
  --info:#2e90fa; --info-weak:#e9f2fe;
  --radius:10px; --radius-sm:7px;
  --shadow:0 1px 2px rgba(16,24,40,.05);
  --shadow-md:0 4px 14px rgba(16,24,40,.08);
  --shadow-lg:0 12px 40px rgba(16,24,40,.16);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--text); font-size:14px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:14px;color:inherit}
a{color:var(--primary);text-decoration:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#d0d5dd;border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:#b9c0cc}
::-webkit-scrollbar-track{background:transparent}

/* ---------- layout ---------- */
.app{display:flex;min-height:100vh}
.sidebar{
  width:230px;flex:0 0 230px;background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:40;
}
.brand{padding:18px 18px 14px;border-bottom:1px solid var(--border)}
.brand-row{display:flex;align-items:center;gap:9px}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--primary);display:flex;align-items:center;justify-content:center;flex:0 0 30px}
.brand-mark svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:2}
.brand-name{font-size:14.5px;font-weight:700;letter-spacing:.2px}
.brand-sub{font-size:11px;color:var(--text-3);margin-top:1px}
.nav{padding:10px 10px;flex:1;overflow-y:auto}
.nav-sec{font-size:10.5px;color:var(--text-3);font-weight:600;letter-spacing:.9px;padding:12px 9px 6px;text-transform:uppercase}
.nav-item{
  display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--radius-sm);
  cursor:pointer;color:var(--text-2);font-size:13.5px;font-weight:500;position:relative;
  border:none;background:none;width:100%;text-align:left;min-height:38px;
}
.nav-item:hover{background:var(--surface-3);color:var(--text)}
.nav-item.active{background:var(--primary-weak);color:var(--primary-strong);font-weight:600}
.nav-item.active::before{content:"";position:absolute;left:-10px;top:9px;bottom:9px;width:3px;background:var(--primary);border-radius:0 3px 3px 0}
.nav-item svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;flex:0 0 16px;opacity:.85}
.nav-item.active svg{opacity:1}
.nav-badge{margin-left:auto;background:var(--surface-3);color:var(--text-2);font-size:11px;font-weight:600;padding:1px 6px;border-radius:20px;min-width:20px;text-align:center}
.nav-item.active .nav-badge{background:#dbe4ff;color:var(--primary-strong)}
.nav-badge.hot{background:var(--danger-weak);color:var(--danger)}
.sidebar-foot{padding:10px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:6px}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  height:56px;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;padding:0 20px;position:sticky;top:0;z-index:30;
}
.crumb{font-size:15px;font-weight:650;display:flex;align-items:center;gap:8px;min-width:0}
.crumb-en{font-size:11.5px;color:var(--text-3);font-weight:500}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.content{flex:1;padding:18px 20px 40px;min-width:0}
.mobile-only{display:none}

/* ---------- today strip ---------- */
.today-strip{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 20px}
.today-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.today-title{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.today-title svg{width:15px;height:15px;stroke:var(--primary);fill:none;stroke-width:2}
.today-count{font-size:11.5px;color:var(--text-3);font-weight:500}
.today-list{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.today-card{
  flex:0 0 auto;min-width:230px;max-width:300px;border:1px solid var(--border);border-radius:var(--radius);
  padding:9px 11px;background:var(--surface-2);display:flex;gap:9px;align-items:flex-start;
}
.today-card.overdue{border-color:#fecdca;background:#fffbfa}
.today-card .tc-body{flex:1;min-width:0}
.tc-comp{font-size:12.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc-role{font-size:11.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc-act{font-size:12.5px;color:var(--text-2);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tc-meta{display:flex;align-items:center;gap:6px;margin-top:5px;flex-wrap:wrap}
.today-empty{font-size:12.5px;color:var(--text-3);padding:2px 0}

/* ---------- generic ---------- */
.h-page{display:flex;align-items:flex-end;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.h-title{font-size:19px;font-weight:700;margin:0}
.h-desc{font-size:12.5px;color:var(--text-3)}
.grid{display:grid;gap:12px}
.grid-6{grid-template-columns:repeat(6,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:14px 16px}
.card-head{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.card-head h3{margin:0;font-size:13.5px;font-weight:650}
.card-head .sub{font-size:11.5px;color:var(--text-3)}
.card-head .right{margin-left:auto;display:flex;gap:6px;align-items:center}

.metric{padding:13px 14px}
.metric-label{font-size:11.5px;color:var(--text-3);font-weight:600;display:flex;align-items:center;gap:5px}
.metric-label svg{width:13px;height:13px;stroke:var(--text-3);fill:none;stroke-width:2}
.metric-val{font-size:25px;font-weight:750;letter-spacing:-.5px;margin-top:4px;line-height:1.1}
.metric-foot{font-size:11px;color:var(--text-3);margin-top:2px}
.metric.accent-b .metric-val{color:var(--primary)}
.metric.accent-g .metric-val{color:var(--success)}
.metric.accent-p .metric-val{color:var(--purple)}
.metric.accent-c .metric-val{color:var(--cyan)}
.metric.accent-w .metric-val{color:var(--warn)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:7px 12px;border-radius:var(--radius-sm);border:1px solid var(--border-strong);
  background:var(--surface);color:var(--text-2);font-size:13px;font-weight:600;cursor:pointer;
  min-height:36px;white-space:nowrap;transition:.12s;
}
.btn:hover{background:var(--surface-3);color:var(--text)}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-strong);border-color:var(--primary-strong);color:#fff}
.btn-ghost{border-color:transparent;background:transparent}
.btn-ghost:hover{background:var(--surface-3)}
.btn-danger{color:var(--danger);border-color:#fecdca;background:var(--surface)}
.btn-danger:hover{background:var(--danger-weak);color:var(--danger)}
.btn-sm{padding:4px 9px;min-height:30px;font-size:12px;border-radius:6px}
.btn-xs{padding:2px 7px;min-height:26px;font-size:11.5px;border-radius:6px}
.btn-full{width:100%}

.tag{display:inline-flex;align-items:center;gap:4px;padding:1.5px 8px;border-radius:20px;font-size:11.5px;font-weight:600;line-height:1.7;white-space:nowrap}
.tag-dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:6px;background:var(--surface-3);font-size:11.5px;color:var(--text-2);font-weight:500}
.chip svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;flex:0 0 12px}
.small svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;vertical-align:-2px}
.arrow-ico svg{width:13px;height:13px;stroke:var(--primary);fill:none;stroke-width:2.4;display:block}
.p0{background:var(--danger-weak);color:#b42318}
.p1{background:var(--warn-weak);color:#b54708}
.p2{background:var(--surface-3);color:var(--text-2)}

.field{margin-bottom:11px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:4px}
.field .hint{font-size:11px;color:var(--text-3);font-weight:400;margin-top:3px}
input[type=text],input[type=date],input[type=number],input[type=url],select,textarea{
  width:100%;padding:8px 10px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);
  background:var(--surface);font-size:16px;outline:none;transition:.12s;
}
@media(min-width:769px){input[type=text],input[type=date],input[type=number],input[type=url],select,textarea{font-size:13.5px}}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(59,91,219,.12)}
textarea{resize:vertical;min-height:70px;line-height:1.6}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

.empty{text-align:center;padding:38px 20px;color:var(--text-3)}
.empty svg{width:38px;height:38px;stroke:var(--border-strong);fill:none;stroke-width:1.6;margin-bottom:8px}
.empty p{margin:0 0 12px;font-size:13px}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:28px 14px;overflow-y:auto}
.modal{background:var(--surface);border-radius:12px;width:100%;max-width:600px;box-shadow:var(--shadow-lg);margin:auto 0}
.modal.wide{max-width:840px}
.modal-head{padding:15px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.modal-head h3{margin:0;font-size:15px;font-weight:700}
.modal-head .x{margin-left:auto;background:none;border:none;cursor:pointer;color:var(--text-3);padding:6px;border-radius:6px;display:flex;min-height:36px;min-width:36px;align-items:center;justify-content:center}
.modal-head .x:hover{background:var(--surface-3);color:var(--text)}
.modal-head .x svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.modal-body{padding:16px 18px;max-height:64vh;overflow-y:auto}
.modal-foot{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;position:sticky;bottom:0;background:var(--surface);border-radius:0 0 12px 12px}

.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(14px);background:#101828;color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;z-index:200;opacity:0;pointer-events:none;transition:.22s;box-shadow:var(--shadow-md);max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- table / list ---------- */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:11.5px;color:var(--text-3);font-weight:650;text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface-2)}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:top}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:var(--surface-2)}

/* ---------- split (opportunities) ---------- */
.split{display:grid;grid-template-columns:340px 1fr;gap:14px;align-items:start}
.list-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);position:sticky;top:74px;max-height:calc(100vh - 96px);display:flex;flex-direction:column}
.list-tools{padding:10px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
.search-wrap{position:relative}
.search-wrap svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--text-3);fill:none;stroke-width:2;pointer-events:none}
.search-wrap input{padding-left:30px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters select{padding:5px 8px;font-size:12px;min-height:32px;width:auto;flex:1;min-width:0}
.list-scroll{overflow-y:auto;flex:1}
.opp-item{padding:11px 12px;border-bottom:1px solid var(--border);cursor:pointer;transition:.1s;border-left:3px solid transparent}
.opp-item:hover{background:var(--surface-2)}
.opp-item.active{background:var(--primary-weak);border-left-color:var(--primary)}
.opp-top{display:flex;align-items:flex-start;gap:8px}
.opp-co{font-size:13.5px;font-weight:650;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opp-role{font-size:12.5px;color:var(--text-2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opp-meta{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap}
.opp-next{font-size:11.5px;color:var(--text-3);margin-top:5px;display:flex;gap:5px;align-items:flex-start}
.opp-next svg{width:12px;height:12px;flex:0 0 12px;margin-top:3px;stroke:var(--text-3);fill:none;stroke-width:2}
.opp-next.od{color:var(--danger)}
.opp-next.od svg{stroke:var(--danger)}

.detail-panel{min-width:0}
.sec{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px;box-shadow:var(--shadow);overflow:hidden}
.sec-head{padding:11px 15px;display:flex;align-items:center;gap:9px;cursor:pointer;user-select:none}
.sec-num{width:20px;height:20px;border-radius:5px;background:var(--primary-weak);color:var(--primary-strong);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 20px}
.sec-title{font-size:13.5px;font-weight:650}
.sec-sub{font-size:11.5px;color:var(--text-3);margin-left:auto}
.sec-head .chev{margin-left:8px;width:14px;height:14px;stroke:var(--text-3);fill:none;stroke-width:2.2;transition:.15s;flex:0 0 14px}
.sec.collapsed .sec-head .chev{transform:rotate(-90deg)}
.sec.collapsed .sec-body{display:none}
.sec-body{padding:13px 15px;border-top:1px solid var(--border)}

.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:11px 14px}
.kv-item .k{font-size:11px;color:var(--text-3);font-weight:600;margin-bottom:2px}
.kv-item .v{font-size:13px;font-weight:550;word-break:break-word}
.jd-box{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 13px;font-size:12.5px;line-height:1.75;white-space:pre-wrap;max-height:300px;overflow-y:auto;color:var(--text-2)}

.req-row{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--border)}
.req-row:last-child{border-bottom:none}
.req-main{flex:1;min-width:0}
.req-text{font-size:13px;font-weight:550}
.req-note{font-size:11.5px;color:var(--text-3);margin-top:2px}
.match-grid{display:flex;flex-direction:column;gap:8px}
.match-row{border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 11px;background:var(--surface-2)}
.match-top{display:flex;gap:8px;align-items:flex-start}
.match-req{font-size:12.5px;font-weight:600;flex:1;min-width:0}
.match-ev{font-size:12.5px;color:var(--text-2);margin-top:4px;display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap}
.arrow-ico{width:13px;height:13px;stroke:var(--primary);fill:none;stroke-width:2.4;flex:0 0 13px;margin-top:4px}
.strength{font-size:11px;font-weight:700;padding:1px 7px;border-radius:20px}
.s-strong{background:var(--success-weak);color:#027a48}
.s-mid{background:var(--warn-weak);color:#b54708}
.s-weak{background:var(--danger-weak);color:#b42318}

.timeline{display:flex;flex-direction:column;gap:0}
.tl-item{display:flex;gap:11px;padding:0 0 14px;position:relative}
.tl-item:last-child{padding-bottom:0}
.tl-dot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 26px;font-size:11px;font-weight:700;color:#fff;z-index:1}
.tl-item:not(:last-child)::before{content:"";position:absolute;left:12.5px;top:26px;bottom:0;width:2px;background:var(--border)}
.tl-body{flex:1;min-width:0;padding-top:2px}
.tl-title{font-size:13px;font-weight:650}
.tl-meta{font-size:11.5px;color:var(--text-3);margin-top:1px}
.tl-note{font-size:12.5px;color:var(--text-2);margin-top:4px;white-space:pre-wrap;line-height:1.6}

.next-box{border:1px solid var(--primary);background:var(--primary-weak);border-radius:var(--radius);padding:12px 14px}
.next-box.od{border-color:#fecdca;background:#fffbfa}
.next-label{font-size:11px;font-weight:700;color:var(--primary-strong);letter-spacing:.4px}
.next-box.od .next-label{color:#b42318}
.next-act{font-size:15px;font-weight:700;margin-top:3px;line-height:1.4}
.next-due{font-size:12px;color:var(--text-2);margin-top:5px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.next-due svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2}
.next-due.od{color:var(--danger);font-weight:650}

.funnel{display:flex;flex-direction:column;gap:9px}
.fn-row{display:flex;align-items:center;gap:10px}
.fn-name{width:64px;flex:0 0 64px;font-size:12px;color:var(--text-2);font-weight:600}
.fn-bar-wrap{flex:1;background:var(--surface-3);border-radius:5px;height:26px;position:relative;overflow:hidden}
.fn-bar{height:100%;border-radius:5px;display:flex;align-items:center;padding:0 9px;color:#fff;font-size:12px;font-weight:700;min-width:34px;transition:width .4s}
.fn-rate{width:62px;flex:0 0 62px;text-align:right;font-size:11.5px;color:var(--text-3);font-weight:600}

.placeholder-note{background:var(--surface-2);border:1px dashed var(--border-strong);border-radius:var(--radius-sm);padding:9px 12px;font-size:12px;color:var(--text-3);margin-bottom:12px;display:flex;gap:7px;align-items:flex-start}
.placeholder-note svg{width:14px;height:14px;flex:0 0 14px;margin-top:2px;stroke:var(--text-3);fill:none;stroke-width:2}

.ev-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:13px 15px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:7px}
.ev-head{display:flex;align-items:flex-start;gap:8px}
.ev-name{font-size:14px;font-weight:680;flex:1;min-width:0}
.ev-sec-t{font-size:11px;font-weight:700;color:var(--text-3);letter-spacing:.5px;margin-top:2px}
.ev-line{font-size:12.5px;color:var(--text-2);line-height:1.6}
.ev-line b{color:var(--text-3);font-weight:650;font-size:11px;display:inline-block;min-width:44px}
.ev-foot{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:2px;padding-top:8px;border-top:1px dashed var(--border)}

.divider{height:1px;background:var(--border);margin:14px 0}
.row-between{display:flex;align-items:center;gap:8px}
.muted{color:var(--text-3)}
.small{font-size:12px}
.b{font-weight:650}
.backup-tip{background:var(--warn-weak);border:1px solid #fedf89;color:#b54708;border-radius:var(--radius-sm);padding:8px 12px;font-size:12.5px;margin-bottom:12px;display:flex;gap:8px;align-items:center}
.backup-tip svg{width:15px;height:15px;flex:0 0 15px;stroke:currentColor;fill:none;stroke-width:2}

function loadAll(){

    if(!obj(x)) throw Error('字段类型无效');
    Object.keys(x).forEach(function(k){
      if(['__proto__','prototype','constructor'].indexOf(k)>=0) throw Error('危险字段');
      var v=x[k];
      if(['reqs','matches','statusHistory','evidenceIds'].indexOf(k)>=0){if(!Array.isArray(v))throw Error(k+' 必须是数组');if(k==='evidenceIds' && v.some(function(id){return typeof id!=='string';}))throw Error('evidenceIds 必须为文本数组');}
      else if(v!==null && typeof v!=='string' && typeof v!=='boolean' && !(['score','rating','order','matchScore'].includes(k) && typeof v==='number')) throw Error(k+' 字段类型错误');
      check(v,depth+1);
    });
  }
  STORES.forEach(function(k){
    if(k==='meta'){if(data.meta && !obj(data.meta))throw Error('meta 类型错误'); out.meta=data.meta||{}; return;}
    if(data[k]===undefined){out[k]={items:[]};return;}
    found=true;
    if(!obj(data[k]) || !Array.isArray(data[k].items)) throw Error(k+' 缺少 items 数组');
    var ids=new Set();
    data[k].items.forEach(function(it){
      if(!obj(it) || typeof it.id!=='string' || !it.id || ids.has(it.id)) throw Error(k+' ID 无效或重复'); ids.add(it.id);
      check(it,0);
      ['reqs','matches'].forEach(function(f){var seen=new Set();(it[f]||[]).forEach(function(v){if(!obj(v)||typeof v.id!=='string'||!v.id||seen.has(v.id))throw Error(f+' 子记录 ID 无效');seen.add(v.id);if(f==='reqs' && typeof v.text!=='string')throw Error('要求必须有文本');if(f==='matches' && (typeof v.reqId!=='string'||typeof v.evId!=='string'))throw Error('匹配关联必须是文本 ID');});});
      (it.statusHistory||[]).forEach(function(v){if(!obj(v)||STATUS_ALL.indexOf(v.status)<0||typeof v.at!=='string'||isNaN(Date.parse(v.at)))throw Error('状态历史格式无效');});
      ['company','role','title','name','jd','oppId','evId','date','status'].forEach(function(f){if(it[f]!==undefined && typeof it[f]!=='string')throw Error(f+' 必须为文本');});
      if(k==='opportunities' && STATUS_ALL.indexOf(it.status)<0)throw Error('岗位状态无效');
      ['date','appliedDate','nextDue','due'].forEach(function(f){if(it[f] && (!/^\d{4}-\d{2}-\d{2}$/.test(it[f]) || isNaN(Date.parse(it[f])) || new Date(it[f]).toISOString().slice(0,10)!==it[f]))throw Error(f+' 日期无效');});
    });
    out[k]=data[k];
  });
  if(!found) throw Error('未找到业务数据');
  if(out.meta.goal!==undefined && (!obj(out.meta.goal) || Object.values(out.meta.goal).some(function(v){return typeof v!=='string';})))throw Error('目标格式错误');
  return JSON.parse(JSON.stringify(out));
}

/* 需要跟进的 Next Action：有 nextAction 且状态未终结 */
function pendingActions(){
  return allOpps()
    .filter(function(o){ return o.nextAction && o.status !== 'Offer' && o.status !== 'Closed' && o.status !== '放弃'; })
    .map(function(o){ return { opp:o, due:o.nextDue || '', over:isOverdue(o.nextDue) }; })
    .sort(function(a,b){
      if(a.over !== b.over) return a.over ? -1 : 1;
      var da = a.due || '9999', db = b.due || '9999';
      return da < db ? -1 : (da > db ? 1 : 0);
    });
}
function overdueCount(){ return pendingActions().filter(function(x){ return x.over; }).length; }

function funnelData(){
  var stages=['已投递','HR沟通','一面','终面','Offer'];
  var names=['投递','回复','面试','终面','Offer'];
  return stages.map(function(st,i){return {name:names[i],c:['#3b5bdb','#06aed4','#7a5af8','#6941c6','#12b76a'][i],v:allOpps().filter(function(o){
    // 完整链队列：每一先行阶段必须有独立证据；不推断跳过的阶段。
    return stages.slice(0,i+1).every(function(t){return (t==='已投递' && !!o.appliedDate) || o.status===t || (o.statusHistory||[]).some(function(e){return e.status===t;});});
  }).length};});
}

  if(od.length){

      oppId:x.opp.id };
  }
  var soon = acts.filter(function(x){ return !x.over && x.due && diffDays(todayStr(), x.due) <= 1; });
  if(soon.length){

    return { title:s.opp.nextAction,
      reason:'这是'+(diffDays(todayStr(), s.due) === 0 ? '今天' : '明天')+'到期的事（'+s.opp.company+' · '+s.opp.priority+'）。趁没逾期先做完。',

      oppId:v.opp ? v.opp.id : null };
  }
  var overdueAct = listOf('actions').filter(function(a){ return a.status !== '已完成' && isOverdue(a.due); });
  if(overdueAct.length){
    return { title:overdueAct[0].title,
      reason:'这是个已逾期的能力补强行动（'+(overdueAct[0].priority||'')+'）。缺口不补，投再多也是重复同样的结果。',
      oppId:overdueAct[0].oppId };
  }
  var ready = allOpps().filter(function(o){ return o.status === '待投递' && o.priority === 'P0'; });
  if(ready.length){
    return { title:'投递 '+ready[0].company+' · '+(ready[0].role||''),
      reason:'这个 P0 岗位已经分析完、进入待投递，卡在这里只会让漏斗上游空转。',
      oppId:ready[0].id };
  }
  var noAct = activeOpps().filter(function(o){ return !o.nextAction; });
  if(noAct.length){
    return { title:'给「'+noAct[0].company+'」补一个 Next Action',
      reason:'有岗位停在流程里却没有下一步动作 —— 这是最典型的「悄悄死掉」的岗位。',
      oppId:noAct[0].id };
  }
  var toAnalyze = allOpps().filter(function(o){ return o.status === '收藏' || (o.status === '待分析' && !(o.reqs || []).length); });
  if(toAnalyze.length){
    return { title:'拆解「'+toAnalyze[0].company+'」的 JD',
      reason:'收藏池里还有岗位没分析。不做 JD 拆解，后面匹配、简历、面试全部无从下手。',
      oppId:toAnalyze[0].id };
  }
  return { title:'收集新的目标岗位 JD',
    reason:'现有流程已经跑顺了。漏斗上游需要补充新的机会。', oppId:null };
}

function bottleneck(){
  var fn = funnelData(), worst = null;
  for(var i = 1; i < fn.length; i++){
    if(fn[i-1].v >= 2){
      var r = fn[i].v / fn[i-1].v;
      if(!worst || r < worst.r) worst = { from:fn[i-1].name, to:fn[i].name, r:Math.round(r*100), loss:fn[i-1].v - fn[i].v };
    }
  }
  var unmatched = 0, oppsWithReq = 0;
  allOpps().forEach(function(o){
    if((o.reqs || []).length){
      oppsWithReq++;
      o.reqs.forEach(function(r){ if(!(o.matches || []).some(function(m){ return m.reqId === r.id; })) unmatched++; });
    }
  });
  var od = overdueCount();
  var parts = [];
  if(fn[0].v>=10 && worst && worst.r < 45) parts.push('漏斗里最窄的一段是「'+worst.from+' → '+worst.to+'」，转化率只有 '+worst.r+'%（损失 '+worst.loss+' 个）。');
  if(unmatched) parts.push('有 '+unmatched+' 条 JD 要求还没匹配到任何 Evidence。');
  if(od) parts.push('有 '+od+' 个岗位的 Next Action 已逾期。');
  if(!parts.length){
    if(fn[0].v < 5) return { t:'上游机会不足', d:'投递基数还太小（'+fn[0].v+' 个），现在看转化率意义不大。先把目标公司和 JD 收集起来，投出去 10 个以上再谈优化。' };
    return { t:'当前没有明显卡点', d:'漏斗各环节转化率正常，也没有逾期项。继续保持投递节奏，等样本更多再做判断。' };
  }
  var sug = '';
  if(worst && worst.to === '回复') sug = '建议：先别急着加量投递，回到简历摘要和岗位匹配度上 —— 同样的简历投再多，回复率也不会变。';
  else if(worst && worst.to === '面试') sug = '建议：回复已经不错但转面试弱，问题多半出在 HR 沟通话术和岗位匹配判断上，把「为什么是我」那一段说具体。';
  else if(worst && worst.to === '终面') sug = '建议：能进面试但过不了，通常是深度和案例讲得不够。去 Interview Hub 做一版针对性准备。';
  else if(worst && worst.to === 'Offer') sug = '建议：能走到终面说明能力被认可，卡在最后多半是薪资预期或动机表达，提前想清楚你的底线和说法。';
  else sug = '建议：按「Next Best Action」先清掉最紧急的一项，再回头补 Evidence 匹配。';
  return { t: parts[0].replace(/^/, '').slice(0, 40), d: parts.join('') + '\n' + sug };
}

function upcomingActions(){
  var acts = pendingActions();
  var today = [], soon = [], waiting = [], ivs = upcomingInterviews(7);
  acts.forEach(function(x){
    if(x.over || (x.due && diffDays(todayStr(), x.due) === 0)) today.push(x);
    else if(x.due && diffDays(todayStr(), x.due) <= 7) soon.push(x);
  });
  allOpps().forEach(function(o){
    var si = stageIdx(o.status);
    if(si >= 3 && si <= 4 && o.appliedDate && diffDays(o.appliedDate, todayStr()) >= 7 && !o.nextAction){
      waiting.push({ opp:o, reason:'投递已 '+diffDays(o.appliedDate, todayStr())+' 天无进展' });
    }
  });
  listOf('contacts').forEach(function(c){
    if(c.nextFollowup && diffDays(todayStr(), c.nextFollowup) <= 3){
      waiting.push({ opp:findById('opportunities', c.oppId), reason:c.name+' · 约定跟进 '+cnDate(c.nextFollowup), contact:c });
    }
  });

  var h = '';
  h += '<div class="up-grp"><div class="up-title'+(today.length?' hot':'')+'">'+ico('alert')+'今天需要完成<span class="n">'+today.length+'</span></div>';
  h += today.length ? today.map(function(x){
      return '<div class="up-row"><div style="flex:1;min-width:0"><div class="t">'+esc(x.opp.nextAction)+'</div>' +
        '<div class="s">'+esc(x.opp.company)+(x.opp.role?(' · '+esc(x.opp.role)):'')+' · '+esc(dueLabel(x.due))+'</div></div>' +
        '<button class="btn btn-xs" data-act="open-opp" data-id="'+x.opp.id+'">去处理'+ico('arrow')+'</button></div>';
    }).join('') : '<div class="s muted" style="padding:4px 0;font-size:12px">今天没有到期事项</div>';

  h += '<div class="up-grp"><div class="up-title">'+ico('clock')+'即将截止（7 天内）<span class="n">'+soon.length+'</span></div>';
  h += soon.length ? soon.slice(0,6).map(function(x){
      return '<div class="up-row"><div style="flex:1;min-width:0"><div class="t">'+esc(x.opp.nextAction)+'</div>' +
        '<div class="s">'+esc(x.opp.company)+' · '+esc(cnDate(x.due))+'</div></div>' +
        '<button class="btn btn-xs" data-act="open-opp" data-id="'+x.opp.id+'">'+ico('arrow')+'</button></div>';
    }).join('') : '<div class="s muted" style="padding:4px 0;font-size:12px">无</div>';
  h += '</div>';

  h += '<div class="up-grp"><div class="up-title">'+ico('inbox')+'等待 Follow-up<span class="n">'+waiting.length+'</span></div>';
  h += waiting.length ? waiting.slice(0,6).map(function(w){
      return '<div class="up-row"><div style="flex:1;min-width:0"><div class="t">'+esc(w.reason)+'</div>' +
        '<div class="s">'+esc(w.opp?w.opp.company:'')+(w.opp&&w.opp.role?(' · '+esc(w.opp.role)):'')+'</div></div>' +
        (w.opp?'<button class="btn btn-xs" data-act="open-opp" data-id="'+w.opp.id+'">'+ico('arrow')+'</button>':'')+'</div>';
    }).join('') : '<div class="s muted" style="padding:4px 0;font-size:12px">无</div>';
  h += '</div>';

  h += '<div class="up-grp"><div class="up-title">'+ico('users')+'即将面试（7 天内）<span class="n">'+ivs.length+'</span></div>';
  h += ivs.length ? ivs.map(function(v){
      return '<div class="up-row"><div style="flex:1;min-width:0"><div class="t">'+esc(v.iv.round||'面试')+' · '+esc(v.opp?v.opp.company:'')+'</div>' +
        '<div class="s">'+esc(cnDate(v.iv.date))+' · '+(v.d === 0 ? '就是今天' : ('还有 '+v.d+' 天'))+(v.iv.interviewer?(' · '+esc(v.iv.interviewer)):'')+'</div></div>' +
        (v.opp?'<button class="btn btn-xs" data-act="open-opp" data-id="'+v.opp.id+'">准备'+ico('arrow')+'</button>':'')+'</div>';
    }).join('') : '<div class="s muted" style="padding:4px 0;font-size:12px">近 7 天没有已排期的面试</div>';
  h += '</div>';
  return h;

function statusDist(){
  var opps = allOpps();
  if(!opps.length) return '<div class="today-empty">暂无数据</div>';
  var buckets = {};
  opps.forEach(function(o){ buckets[o.status] = (buckets[o.status]||0)+1; });
  var max = 1; Object.keys(buckets).forEach(function(k){ if(buckets[k] > max) max = buckets[k]; });
  var h = '<div class="funnel">';
  STATUS_ALL.forEach(function(s){
    if(!buckets[s]) return;
    var c = STATUS_COLOR[s];
    h += '<div class="fn-row"><div class="fn-name" style="width:70px;flex:0 0 70px">'+s+'</div>' +
         '<div class="fn-bar-wrap"><div class="fn-bar" style="width:'+Math.round(buckets[s]/max*100)+'%;background:'+c+'">'+buckets[s]+'</div></div></div>';
  });
  return h + '</div>';
}

function filteredOpps(){
  var f = state.oppFilter, q = (f.q||'').toLowerCase();
  return allOpps().filter(function(o){
    if(f.status && o.status !== f.status) return false;
    if(f.priority && o.priority !== f.priority) return false;
    if(q){
      var s = ((o.company||'')+' '+(o.role||'')+' '+(o.direction||'')+' '+(o.city||'')+' '+(o.jd||'')).toLowerCase();
      if(s.indexOf(q) < 0) return false;
    }
    return true;
  }).sort(function(a,b){
    var pa = PRIORITIES.indexOf(a.priority), pb = PRIORITIES.indexOf(b.priority);
    if(pa !== pb) return (pa<0?9:pa) - (pb<0?9:pb);
    return (b.updatedAt||'') < (a.updatedAt||'') ? -1 : 1;
  });
}

  /* 8 投递记录 */
  h += secToggle(o.id+'_s8', 8, 'Application Record · 投递记录', '', applySection(o));

  /* 9 面试记录 */
  var ivs = interviewsOf(o.id);
  h += secToggle(o.id+'_s9', 9, 'Interview Record · 面试与复盘', ivs.length+' 场', interviewSection(o, ivs));

  /* 10 反馈与 Lesson */
  var fbs = feedbacksOf(o.id);
  h += secToggle(o.id+'_s10', 10, 'Feedback & Lesson · 反馈复盘', fbs.length+' 条', feedbackSection(o, fbs));

  /* 11 下一步行动 + 最终结果 */
  h += secToggle(o.id+'_s11', 11, 'Next Action & Final Result', '', nextActionEditor(o) +

    '<div style="margin-top:8px"><button class="btn btn-primary btn-sm" data-act="result-save" data-id="'+esc(o.id)+'">'+ico('check')+'保存最终结果</button></div>');

  return h;

/* JD Analysis：关键词 + 判断 + 风险 + 要求拆解 */
function jdAnalysisSection(o){
  var a = o.analysis || {}, reqs = o.reqs || [];
  var h = '<div class="form-row-3">' +
    '<div class="field"><label>关键词（逗号分隔）</label><input type="text" id="an_kw_'+esc(o.id)+'" value="'+esc(a.keywords||'')+'" placeholder="医学影像, Python, 注册"></div>' +
    '<div class="field"><label>我的判断</label><select id="an_vd_'+esc(o.id)+'"><option value="">—</option>' +
      RES_VERDICTS.map(function(v){ return '<option value="'+esc(v)+'"'+(a.verdict===v?' selected':'')+'>'+esc(v)+'</option>'; }).join('') +
    '</select></div>' +
    '<div class="field"><label>&nbsp;</label><button class="btn btn-sm btn-full" data-act="analysis-save" data-id="'+esc(o.id)+'">'+ico('check')+'保存分析</button></div>' +
  '</div>';
  h += '<div class="field"><label>风险点 / 会被挑战的地方</label>' +
    '<textarea id="an_nt_'+esc(o.id)+'" rows="2" placeholder="例：我没有注册经验；产品年限可能被质疑">'+esc(a.notes||'')+'</textarea></div>';
  if(a.keywords){
    h += '<div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px">' +
      String(a.keywords).split(/[,，]/).map(function(k){ return k.trim() ? '<span class="chip">'+esc(k.trim())+'</span>' : ''; }).join('') + '</div>';
  }
  if(a.verdict) h += '<div style="margin-bottom:8px">'+tag(a.verdict, a.verdict==='不匹配'?'#f04438':(a.verdict==='值得投'||a.verdict==='强烈推荐'?'#12b76a':'#f79009'))+'</div>';

  h += '<div class="divider"></div><div class="chain" style="margin-bottom:8px">' +
    '<i class="hi">JD Requirement</i><span class="ar">→</span><i>Evidence</i><span class="ar">→</span><i>Resume Bullet</i><span class="ar">→</span><i>Interview Story</i></div>';

  h += reqs.length ? '<div>' + reqs.map(function(r){
      return '<div class="req-row"><div class="req-main"><div class="req-text">'+esc(r.text)+'</div>' +
        (r.note?'<div class="req-note">'+esc(r.note)+'</div>':'')+'</div>' +
        '<span class="chip">'+esc(r.level||'要求')+'</span>' +
        '<button class="btn btn-xs" data-act="req-edit" data-id="'+esc(o.id)+'" data-rid="'+esc(r.id)+'">'+ico('edit')+'</button>' +
        '<button class="btn btn-xs btn-danger" data-act="req-del" data-id="'+esc(o.id)+'" data-rid="'+esc(r.id)+'">'+ico('trash')+'</button></div>';
    }).join('') + '</div>'
    : '<div class="today-empty">还没拆解。把 JD 拆成 3-8 条具体要求（必备 / 加分），后面才能逐条匹配证据。</div>';

  h += '<div style="margin-top:9px;display:flex;gap:6px;flex-wrap:wrap">' +
    '<button class="btn btn-sm" data-act="req-add" data-id="'+esc(o.id)+'">'+ico('plus')+'添加要求</button>' +
    (o.jd ? '<button class="btn btn-sm" data-act="req-bulk" data-id="'+esc(o.id)+'">'+ico('copy')+'从 JD 按行批量导入</button>' : '') +
    (o.jd ? copilotBtn('jd', o.id, 'Copilot 拆解 JD') : '') +
  '</div>';
  return h;
}

/* Gap Analysis：本岗位缺口 + 未匹配要求 */
function gapAnalysisSection(o){
  var un = (o.reqs || []).filter(function(r){ return !(o.matches || []).some(function(m){ return m.reqId === r.id; }); });
  var gs = gapsOfOpp(o.id);
  var h = '';
  if(un.length){
    h += '<div style="font-size:11px;font-weight:720;color:var(--text-3);margin-bottom:6px">未匹配的 JD 要求（'+un.length+'）→ 缺口候选</div>';
    h += un.map(function(r){
      return '<div class="req-row"><div class="req-main"><div class="req-text">'+esc(r.text)+'</div>' +
        '<div class="req-note">判断缺口类型后再补，不要一上来就认定自己不行</div></div>' +
        '<button class="btn btn-xs" data-act="gap-from-req" data-id="'+esc(o.id)+'" data-rid="'+esc(r.id)+'">'+ico('arrow')+'建为缺口</button></div>';
    }).join('');
    h += '<div style="margin:8px 0">' + copilotBtn('gap', o.id, 'Copilot 识别缺口类型') + '</div><div class="divider"></div>';
  }
  if(gs.length){
    h += gs.map(function(g){
      var as = actionsOf(g.id);
      return '<div class="sub-card"><div class="sc-t">'+esc(g.title)+'</div>' +
        '<div class="sc-m" style="margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center">' +
          gapTypeTag(g.gapType) + severityTag(g.severity) + statusTag2(g.status||'待开始') +
          (g.due?'<span class="chip">'+ico('clock')+esc(dueLabel(g.due))+'</span>':'') + '</div>' +
        (as.length ? '<div style="margin-top:7px">' + as.map(function(a){
            return '<div class="act-row"><span class="chip">'+esc(a.status||'待开始')+'</span>' +
              '<span class="a-t">'+esc(a.title)+'</span>' +
              (a.due?'<span class="chip">'+esc(cnDate(a.due))+'</span>':'') + '</div>';
          }).join('') + '</div>' : '<div class="sc-m" style="color:var(--danger);margin-top:6px">还没有对应 Action —— 每个 Gap 至少要有一个行动</div>') +
        '<div style="margin-top:7px;display:flex;gap:6px;flex-wrap:wrap">' +
          '<button class="btn btn-xs" data-act="action-add" data-gap="'+esc(g.id)+'" data-opp="'+esc(o.id)+'">'+ico('plus')+'加 Action</button>' +
          '<button class="btn btn-xs" data-act="nav" data-view="gap">'+ico('arrow')+'去 Gap & Action</button>' +
        '</div></div>';
    }).join('');
  } else if(!un.length){
    h += '<div class="today-empty">这个岗位目前没有识别到缺口。</div>';
  }
  h += '<div style="margin-top:8px"><button class="btn btn-sm" data-act="gap-add-opp" data-id="'+esc(o.id)+'">'+ico('plus')+'手动添加缺口</button></div>';
  return h;
}

/* 联系人 */
function contactSection(o){
  var cs = contactsOf(o.id);
  var h = cs.length ? cs.map(function(c){
    var od = isOverdue(c.nextFollowup);
    return '<div class="sub-card"><div style="display:flex;gap:8px;align-items:flex-start">' +
      '<div style="flex:1;min-width:0"><div class="sc-t">'+esc(c.name)+(c.title?(' <span class="muted" style="font-weight:400">· '+esc(c.title)+'</span>'):'')+'</div>' +
      '<div class="sc-m">'+esc(c.type||'')+(c.contactInfo?(' · '+esc(c.contactInfo)):'')+(c.relation?(' · '+esc(c.relation)):'')+'</div>' +
      '<div class="sc-m" style="margin-top:3px">最近联系 '+(c.lastContact?esc(cnDate(c.lastContact)):'未记录')+
        (c.nextFollowup?(' · 下次跟进 <b style="color:'+(od?'var(--danger)':'var(--text-2)')+'">'+esc(cnDate(c.nextFollowup))+'</b>'):'')+'</div></div>' +
      '<button class="btn btn-xs" data-act="ct-edit" data-id="'+esc(c.id)+'">'+ico('edit')+'</button>' +
      '<button class="btn btn-xs btn-danger" data-act="ct-del" data-id="'+esc(c.id)+'">'+ico('trash')+'</button>' +
    '</div></div>';
  }).join('') : '<div class="today-empty">还没有联系人。内推和 HR 关系的价值在于「跟进」，记下来才不会断。</div>';
  h += '<div style="margin-top:8px"><button class="btn btn-sm" data-act="ct-add" data-opp="'+esc(o.id)+'">'+ico('plus')+'添加联系人</button></div>';
  return h;
}

function nextActionBox(o){
  var od = isOverdue(o.nextDue) && o.nextAction;
  var has = !!o.nextAction;
  return '<div class="next-box'+(od?' od':'')+'" style="margin-top:12px">' +
    '<div class="next-label">NEXT ACTION · 下一步行动</div>' +
    (has ? '<div class="next-act">'+esc(o.nextAction)+'</div>' : '<div class="next-act" style="color:var(--danger)">⚠ 这个岗位还没有 Next Action</div>') +
    '<div class="next-due'+(od?' od':'')+'">' + ico('clock') +
      '<span>'+(o.nextDue ? (cnDate(o.nextDue)+' · '+dueLabel(o.nextDue)) : '未设截止日期')+'</span>' +
      '<span style="margin-left:auto;display:flex;gap:6px">' +
        '<button class="btn btn-xs" data-act="next-edit" data-id="'+esc(o.id)+'">'+ico('edit')+'编辑</button>' +
        (has?'<button class="btn btn-xs btn-primary" data-act="done-next" data-id="'+esc(o.id)+'">'+ico('check')+'标记完成</button>':'') +
      '</span>' +
    '</div></div>';
}

      '<button class="btn btn-xs" data-act="set-due" data-id="'+esc(o.id)+'" data-d="3">3天后</button>' +

    '</div></div></div>' +
    '<button class="btn btn-primary btn-sm" data-act="next-save" data-id="'+esc(o.id)+'">'+ico('check')+'保存 Next Action</button>';
}

function matchSection(o){
  var reqs = o.reqs || [], ms = o.matches || [], evs = listOf('evidence');
  if(!reqs.length) return '<div class="today-empty">先在「JD 要求拆解」里添加要求，再逐条挂上你的 Evidence。</div>';
  var h = '<div class="match-grid">';
  reqs.forEach(function(r){
    var mine = ms.filter(function(m){ return m.reqId === r.id; });
    h += '<div class="match-row"><div class="match-top">' +
      '<span class="chip" style="background:'+(r.level==='加分'?'var(--surface-3)':'var(--primary-weak)')+';color:'+(r.level==='加分'?'var(--text-2)':'var(--primary-strong)')+'">'+esc(r.level||'要求')+'</span>' +
      '<span class="match-req">'+esc(r.text)+'</span>' +
      (mine.length ? '' : '<button class="btn btn-xs" data-act="match-add" data-id="'+esc(o.id)+'" data-rid="'+esc(r.id)+'">'+ico('plus')+'匹配证据</button>') +
    '</div>';
    if(!mine.length){
      h += '<div class="match-ev" style="color:var(--danger)">未匹配 —— 这是你的能力缺口候选，可一键转入「能力缺口与行动」</div>' +
           '<div style="margin-top:6px"><button class="btn btn-xs" data-act="gap-from-req" data-id="'+esc(o.id)+'" data-rid="'+esc(r.id)+'">'+ico('arrow')+'转为能力缺口</button></div>';
    } else {
      mine.forEach(function(m){
        var ev = evs.filter(function(e){ return e.id === m.evId; })[0];
        var sc = m.strength==='强'?'s-strong':(m.strength==='中'?'s-mid':'s-weak');
        h += '<div class="match-ev"><span class="arrow-ico" style="display:inline-block;width:13px;height:13px;stroke:var(--primary);fill:none;stroke-width:2.4">'+ico('arrow')+'</span>' +
          '<span style="flex:1;min-width:0"><b style="font-weight:650">'+(ev?esc(ev.name):'（证据已删除）')+'</b>' +
          (ev && ev.strength ? ' '+strengthTag2(ev.strength) : '') +
          (m.note?'<span class="muted"> — '+esc(m.note)+'</span>':'')+'</span>' +
          '<span class="strength '+sc+'">'+esc(m.strength||'中')+'</span>' +
          '<button class="btn btn-xs" data-act="match-edit" data-id="'+esc(o.id)+'" data-mid="'+esc(m.id)+'">'+ico('edit')+'</button>' +
          '<button class="btn btn-xs btn-danger" data-act="match-del" data-id="'+esc(o.id)+'" data-mid="'+esc(m.id)+'">'+ico('trash')+'</button></div>';
      });
    }
    h += '</div>';
  });
  h += '</div>';
  h += '<div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap">' +
    (ms.length ? '<button class="btn btn-sm" data-act="copy-match" data-id="'+esc(o.id)+'">'+ico('copy')+'复制证据摘要</button>' : '') +
    copilotBtn('match', o.id, 'Copilot 找匹配证据') +
  '</div>';
  return h;
}

function resumeSection(o){
  var rs = listOf('resumes');
  var h = '<div class="field"><label>该岗位使用的简历版本</label>' +
    '<select data-chg="set-resume" data-id="'+esc(o.id)+'"><option value="">— 未指定 —</option>' +
    rs.map(function(r){ return '<option value="'+esc(r.name)+'"'+(o.resumeVersion===r.name?' selected':'')+'>'+esc(r.name)+(r.targetRole?(' · '+esc(r.targetRole)):'')+'</option>'; }).join('') +
    '</select>' +
    '<div class="hint">没有合适版本？先去「简历中心」新建一版（简历 = Evidence 的组合）</div></div>';
  var cur = rs.filter(function(r){ return r.name === o.resumeVersion; })[0];
  if(cur){
    var evs = listOf('evidence');
    var ids = cur.evidenceIds || [];
    h += '<div style="font-size:11px;font-weight:700;color:var(--text-3);margin-bottom:5px">该版本包含的 Evidence（'+ids.length+'）</div>';
    h += ids.length ? '<div style="display:flex;gap:6px;flex-wrap:wrap">' + ids.map(function(id){
        var e = evs.filter(function(x){ return x.id === id; })[0];
        return '<span class="chip">'+esc(e?e.name:'（已删除）')+'</span>';
      }).join('') + '</div>' : '<div class="muted small">该版本还没有挂载 Evidence</div>';
    if(cur.notes) h += '<div style="margin-top:8px;font-size:12.5px;color:var(--text-2)">'+esc(cur.notes)+'</div>';
    var bullets = ids.map(function(id){
      var e = evs.filter(function(x){ return x.id === id; })[0];
      return (e && e.resumeBullet) ? e.resumeBullet : null;
    }).filter(Boolean);
    if(bullets.length){
      h += '<div style="margin-top:10px"><div style="font-size:11px;font-weight:720;color:var(--text-3);margin-bottom:5px">Resume Bullet 预览（来自 Evidence）</div>' +
        '<div class="jd-box" style="background:var(--surface);max-height:none">' + bullets.map(function(b){ return '· '+esc(b); }).join('<br>') + '</div></div>';
    }
  }
  h += '<div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap">' +
    '<button class="btn btn-sm" data-act="nav" data-view="resume">'+ico('file')+'去简历中心</button>' +
    '<button class="btn btn-sm" data-act="resume-new">'+ico('plus')+'新建简历版本</button>' +
    copilotBtn('resume', o.id, 'Copilot 基于 Evidence 改简历') +
  '</div>';
  return h;
}

function applySection(o){
  var h = '<div class="kv" style="margin-bottom:12px">' +
    '<div class="kv-item"><div class="k">当前状态</div><div class="v">'+statusTag(o.status)+'</div></div>' +
    '<div class="kv-item"><div class="k">投递日期</div><div class="v">'+esc(o.appliedDate ? (o.appliedDate+' · '+cnDate(o.appliedDate)) : '未投递')+'</div></div>' +
    '<div class="kv-item"><div class="k">来源渠道</div><div class="v">'+esc(o.source||'—')+'</div></div>' +
    '<div class="kv-item"><div class="k">联系人</div><div class="v">'+esc(o.contact||'—')+'</div></div>' +
    '<div class="kv-item"><div class="k">使用简历</div><div class="v">'+esc(o.resumeVersion||'—')+'</div></div>' +
    '<div class="kv-item"><div class="k">最终结果</div><div class="v">'+esc(o.result||'进行中')+'</div></div>' +
  '</div>';
  h += '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">' +
    '<button class="btn btn-sm" data-act="mark-applied" data-id="'+esc(o.id)+'">'+ico('check')+'标记今日已投递</button>' +
    '<button class="btn btn-sm" data-act="next-stage" data-id="'+esc(o.id)+'">'+ico('arrow')+'推进到下一阶段</button>' +
  '</div>';
  h += '<div style="font-size:11px;font-weight:700;color:var(--text-3);margin-bottom:8px">时间线</div><div class="timeline">' + timelineOf(o) + '</div>';
  return h;

function timelineOf(o){
  var items = [];
  (o.statusHistory||[]).forEach(function(e){items.push({d:e.at.slice(0,10),t:'状态：'+e.status,m:e.at,c:'#3b5bdb'});});
  if(o.createdAt) items.push({ d:o.createdAt, t:'录入岗位', m:'来源：'+(o.source||'—'), c:'#98a2b3', tag:'' });
  if(o.appliedDate) items.push({ d:o.appliedDate, t:'投递', m:'使用简历：'+(o.resumeVersion||'—'), c:'#3b5bdb', tag:'' });
  interviewsOf(o.id).forEach(function(iv){
    items.push({ d:iv.date||'', t:iv.round||'面试', m:(iv.type?iv.type+' · ':'')+(iv.interviewer||''), c:'#7a5af8', n:iv.notes, tag:iv.result });
  });
  feedbacksOf(o.id).forEach(function(fb){
    items.push({ d:fb.date||'', t:'反馈复盘', m:fb.channel||'', c:'#f79009', n:fb.content, tag:'' });
  });
  if(!items.length) return '<div class="today-empty">还没有可追踪的记录</div>';
  items.sort(function(a,b){ return (a.d||'0') < (b.d||'0') ? -1 : 1; });
  return items.map(function(it){
    return '<div class="tl-item"><div class="tl-dot" style="background:'+it.c+'">'+(it.d?('<span style="font-size:9px">'+esc(it.d.slice(5).replace('-','/'))+'</span>'):'?')+'</div>' +
      '<div class="tl-body"><div class="tl-title">'+esc(it.t)+(it.tag?(' <span class="chip">'+esc(it.tag)+'</span>'):'')+'</div>' +
      '<div class="tl-meta">'+esc(it.d||'无日期')+(it.m?(' · '+esc(it.m)):'')+'</div>' +
      (it.n?'<div class="tl-note">'+esc(it.n)+'</div>':'')+'</div></div>';
  }).join('');
}

function debriefBlock(iv){
  var has = iv.wentWell || iv.wentBad || iv.gapFound || iv.newEvidence || iv.lessonNote || iv.nextAction;
  if(!has) return '';
  var h = '<div style="margin-top:6px;border:1px dashed var(--border-strong);border-radius:var(--radius-sm);padding:8px 10px;background:var(--surface-2)">';
  h += '<div style="font-size:11px;font-weight:720;color:var(--text-3);margin-bottom:4px">DEBRIEF · 面试复盘</div>';
  if(iv.wentWell) h += '<div class="small" style="color:#027a48"><b>答得好：</b>'+esc(iv.wentWell)+'</div>';
  if(iv.wentBad)  h += '<div class="small" style="color:#b42318;margin-top:3px"><b>答得差：</b>'+esc(iv.wentBad)+'</div>';
  if(iv.gapFound) h += '<div class="small" style="color:var(--warn);margin-top:3px"><b>暴露 Gap：</b>'+esc(iv.gapFound)+'</div>';
  if(iv.newEvidence) h += '<div class="small" style="color:var(--primary);margin-top:3px"><b>新发现 Evidence：</b>'+esc(iv.newEvidence)+'</div>';
  if(iv.lessonNote) h += '<div class="small" style="margin-top:3px;color:var(--text-2)"><b>Lesson：</b>'+esc(iv.lessonNote)+'</div>';
  if(iv.nextAction) h += '<div class="small" style="margin-top:3px;color:var(--primary)"><b>下一步：</b>'+esc(iv.nextAction)+'</div>';
  h += '<div style="margin-top:7px;display:flex;gap:6px;flex-wrap:wrap">' +
    (iv.gapFound?'<button class="btn btn-xs" data-act="debrief-to-gap" data-iv="'+esc(iv.id)+'">'+ico('arrow')+'Gap → Gap & Action</button>':'') +

/* =========================================================
   模块 2：Evidence Bank —— 长期个人证据库
   ========================================================= */
function viewEvidence(){
  var f = state.evFilter, q = (f.q||'').toLowerCase();
  var items = listOf('evidence').filter(function(e){
    if(f.type && e.type !== f.type) return false;
    if(f.strength && e.strength !== f.strength) return false;
    if(q){
      var s = ((e.name||'')+' '+(e.category||'')+' '+(e.background||'')+' '+(e.action||'')+' '+(e.result||'')+' '+(e.ability||'')+' '+(e.tags||'')+' '+
               (e.capabilityTags||'')+' '+(e.metric||'')+' '+(e.proof||'')+' '+(e.answerQuestions||'')+' '+(e.resumeBullet||'')+' '+(e.story||'')).toLowerCase();
      if(s.indexOf(q) < 0) return false;
    }
    return true;
  });
  var h = '<div class="h-page"><div><h1 class="h-title">个人证据库</h1>' +
    '<div class="h-desc">Evidence 是长期资产，简历只是 Evidence 的组合。共 '+listOf('evidence').length+' 条</div></div>' +
    '<div style="margin-left:auto"><button class="btn btn-primary" data-act="ev-new">'+ico('plus')+'新增证据</button></div></div>';

  h += '<div class="card" style="padding:10px 12px;margin-bottom:12px"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">' +
    '<div class="search-wrap" style="flex:1;min-width:180px">'+ico('search')+
      '<input type="text" data-chg="ev-q" value="'+esc(f.q)+'" placeholder="搜索证据名称 / 内容 / 标签"></div>' +
    '<select data-chg="ev-type" style="width:auto;min-width:120px;min-height:34px"><option value="">全部类型</option>' +
      EV_TYPES.map(function(t){ return '<option value="'+esc(t)+'"'+(f.type===t?' selected':'')+'>'+esc(t)+'</option>'; }).join('') +
    '</select>' +
    '<select data-chg="ev-strength" style="width:auto;min-width:120px;min-height:34px"><option value="">全部强度</option>' +
      EV_STRENGTHS.map(function(t){ return '<option value="'+esc(t)+'"'+(f.strength===t?' selected':'')+'>'+esc(t)+'</option>'; }).join('') +
    '</select></div></div>';

  if(!items.length) return h + '<div class="card"><div class="empty">'+ico('layers')+'<p>还没有证据，先沉淀你最拿得出手的 3 段经历</p>' +
    '<button class="btn btn-primary" data-act="ev-new">'+ico('plus')+'新增证据</button></div></div>';

  h += '<div class="chain" style="margin-bottom:10px"><i class="hi">JD Requirement</i><span class="ar">→</span><i>Evidence</i>' +
       '<span class="ar">→</span><i>Resume Bullet</i><span class="ar">→</span><i>Interview Story</i></div>';

  h += '<div class="grid grid-2">';
  items.forEach(function(e){
    var used = allOpps().filter(function(o){ return (o.matches||[]).some(function(m){ return m.evId === e.id; }); });
    var reqTexts = [];
    used.forEach(function(o){
      (o.matches||[]).forEach(function(m){
        if(m.evId !== e.id) return;
        var r = (o.reqs||[]).filter(function(x){ return x.id === m.reqId; })[0];
        if(r) reqTexts.push(o.company+'：'+r.text);
      });
    });
    h += '<div class="ev-card">' +
      '<div class="ev-head"><div style="flex:1;min-width:0"><div class="ev-name">'+esc(e.name)+'</div>' +
        '<div class="ev-sec-t">'+esc(e.category||'未分类')+'</div></div>' +
        strengthTag2(e.strength) + evTypeTag(e.type) +
        '<button class="btn btn-xs" data-act="ev-edit" data-id="'+esc(e.id)+'">'+ico('edit')+'</button>' +
        '<button class="btn btn-xs btn-danger" data-act="ev-del" data-id="'+esc(e.id)+'">'+ico('trash')+'</button></div>' +
      (e.background?'<div class="ev-line"><b>背景</b>'+esc(e.background)+'</div>':'') +
      (e.action?'<div class="ev-line"><b>我做了</b>'+esc(e.action)+'</div>':'') +
      (e.result?'<div class="ev-line"><b>结果</b>'+esc(e.result)+'</div>':'') +
      (e.metric?'<div class="ev-line"><b>量化</b><span style="color:var(--success);font-weight:650">'+esc(e.metric)+'</span></div>':'') +
      (e.ability?'<div class="ev-line"><b>证明</b>'+esc(e.ability)+'</div>':'') +
      (e.proof?'<div class="ev-line"><b>Proof</b>'+esc(e.proof)+'</div>':'') +
      (e.resumeBullet?'<div class="ev-line"><b>Bullet</b>'+esc(e.resumeBullet)+'</div>':'') +
      (e.answerQuestions?'<div class="ev-line"><b>可答</b>'+esc(e.answerQuestions)+'</div>':'') +
      (e.story?'<div class="ev-line"><b>STAR</b>'+esc(e.story)+'</div>':'') +
      (e.capabilityTags?'<div style="display:flex;gap:5px;flex-wrap:wrap">' +
        String(e.capabilityTags).split(/[,，]/).map(function(t){ return t.trim()?'<span class="chip">'+esc(t.trim())+'</span>':''; }).join('') + '</div>':'') +
      (reqTexts.length?'<div style="font-size:11.5px;color:var(--text-3);margin-top:4px"><b>对应 JD 要求：</b>'+esc(reqTexts.slice(0,3).join('；'))+(reqTexts.length>3?(' 等 '+reqTexts.length+' 条'):'')+'</div>':'') +
      '<div class="ev-foot">' +
        (e.tags?'<span class="chip">'+ico('target')+esc(e.tags)+'</span>':'') +
        '<span class="chip"'+(used.length?' style="background:var(--primary-weak);color:var(--primary-strong)"':'')+'>已被 '+used.length+' 个岗位引用</span>' +
        '<button class="btn btn-xs" data-act="story-from-ev" data-id="'+esc(e.id)+'">'+ico('star')+'沉淀为 STAR Story</button>' +
      '</div></div>';
  });
  h += '</div>';
  return h;
}

function chip(t){ return t ? '<span class="chip">'+esc(t)+'</span>' : ''; }
function tag(t, color){ return t ? '<span class="chip"'+(color?(' style="background:'+color+'1a;color:'+color+'"'):'')+'>'+esc(t)+'</span>' : ''; }
function severityTag(s){
  if(!s) return '';
  var c = s==='高'?'#f04438':(s==='中'?'#f79009':'#98a2b3');
  return '<span class="tag" style="background:'+c+'1a;color:'+c+'">'+esc(s)+'</span>';
}
function statusTag2(s){
  var map = {'待开始':'#98a2b3','进行中':'#f79009','已完成':'#12b76a'};
  var c = map[s] || '#98a2b3';
  return '<span class="tag" style="background:'+c+'1a;color:'+c+'"><i class="tag-dot" style="background:'+c+'"></i>'+esc(s)+'</span>';
}
function row(){ var a=[]; for(var i=0;i<arguments.length;i++){ if(arguments[i]) a.push(arguments[i]); } return a.length?('<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:5px">'+a.join('')+'</div>'):''; }
function cardWrap(it, key, inner){
  return '<div class="ev-card">' + inner +
    '<div class="ev-foot"><button class="btn btn-xs" data-act="s-edit" data-key="'+key+'" data-id="'+esc(it.id)+'">'+ico('edit')+'编辑</button>' +
    '<button class="btn btn-xs btn-danger" data-act="s-del" data-key="'+key+'" data-id="'+esc(it.id)+'">'+ico('trash')+'删除</button></div></div>';
}

/* ---- V2：动态下拉选项 / 通用行渲染 ---- */
function dynOpts(k){
  if(k === 'opps')      return allOpps().map(function(o){ return { v:o.id, t:o.company + ' · ' + (o.role||'') }; });
  if(k === 'gaps')      return listOf('gaps').map(function(g){ return { v:g.id, t:(g.gapType ? g.gapType+' · ' : '') + g.title }; });
  if(k === 'lessons')   return listOf('lessons').map(function(l){ return { v:l.id, t:l.title }; });
  if(k === 'evidence')  return listOf('evidence').map(function(e){ return { v:e.id, t:(e.type ? e.type+' · ' : '') + e.name }; });
  if(k === 'companies') return listOf('companies').map(function(c){ return { v:c.id, t:c.name }; });
  return [];
}
function actionRow(a, compact){
  var g = a.gapId ? findById('gaps', a.gapId) : null;
  var o = a.oppId ? findById('opportunities', a.oppId) : null;
  var od = isOverdue(a.due) && a.status !== '已完成';
  var done = a.status === '已完成';
  var h = '<div class="act-row'+(done?' act-done':'')+'">';
  h += '<button class="btn btn-xs" data-act="action-toggle" data-id="'+esc(a.id)+'" title="'+(done?'重新打开':'标记完成')+'">'+ico(done?'refresh':'check')+'</button>';
  h += '<div class="act-main"><div class="act-t" style="font-size:12.5px;font-weight:620">'+esc(a.title||'')+'</div>';
  var meta = [];
  if(!compact && g) meta.push(tag('Gap：'+g.title, '#7a5af8'));
  if(o) meta.push(chip(o.company));
  if(a.due) meta.push('<span class="chip"'+(od?' style="background:var(--danger-weak);color:var(--danger);font-weight:650"':'')+'>'+ico('clock')+esc(dueLabel(a.due))+'</span>');
  if(meta.length) h += '<div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:3px">'+meta.join('')+'</div>';
  if(a.note) h += '<div class="small muted" style="margin-top:3px">'+esc(a.note)+'</div>';
  h += '</div>' + prioTag(a.priority) + statusTag2(a.status||'待开始');
  h += '<button class="btn btn-xs" data-act="action-edit" data-id="'+esc(a.id)+'">'+ico('edit')+'</button>';
  h += '<button class="btn btn-xs btn-danger" data-act="action-del" data-id="'+esc(a.id)+'">'+ico('trash')+'</button>';
  return h + '</div>';
}
function contactRow(c){
  var o = c.oppId ? findById('opportunities', c.oppId) : null;
  var od = isOverdue(c.nextFollow);
  var h = '<div class="act-row"><div class="act-main">' +
    '<div class="act-t" style="font-size:12.5px;font-weight:620">'+esc(c.name||'')+(c.title?(' · '+esc(c.title)):'')+'</div>' +
    '<div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:3px">' +
      (c.relation?tag(c.relation,'#06aed4'):'') + (c.contact?chip(c.contact):'') + (o?chip(o.company):'') +
      (c.nextFollow?('<span class="chip"'+(od?' style="background:var(--danger-weak);color:var(--danger);font-weight:650"':'')+'>跟进 '+esc(dueLabel(c.nextFollow))+'</span>'):'') +
    '</div></div>';
  h += '<button class="btn btn-xs" data-act="ct-edit" data-id="'+esc(c.id)+'">'+ico('edit')+'</button>' +
       '<button class="btn btn-xs btn-danger" data-act="ct-del" data-id="'+esc(c.id)+'">'+ico('trash')+'</button>';
  return h + '</div>';
}

function openCopilot(scope, id){
  var p = buildCopilotPrompt(scope, id);
  openModal({ title:'AI 辅助提示词生成 · 未调用大模型', wide:true,
    body:'<div class="placeholder-note">'+ico('alert')+'<span>请先检查隐私。演示经历不代表真实业绩。把下面这段复制给任意 AI，再把它的回答填回工作台。<b>AI 只辅助判断，最终决定由你做。</b></span></div>' +
      '<textarea id="copilotText" rows="18" style="font-size:12.5px;line-height:1.75">'+esc(p)+'</textarea>',
    foot:'<button class="btn" data-act="close-modal">关闭</button>' +
         '<button class="btn btn-primary" data-act="copy-copilot">'+ico('copy')+'复制提示词</button>' });
}

function buildCopilotPrompt(scope, id){
  var o = id ? findById('opportunities', id) : null;
  var evs = listOf('evidence');
  var head = '你是我的求职 Copilot。只基于我下面给出的真实材料分析，不要编造经历。\n输出要具体、可执行，并明确区分「事实」与「你的推断」。\n\n';

  if(scope === 'jd' && o){
    return head + '【任务】拆解这份 JD。\n\n【岗位】'+o.company+' · '+(o.role||'')+' · '+(o.city||'')+' · '+(o.salary||'')+
      '\n\n【JD 原文】\n'+(o.jd||'（未填写）')+
      '\n\n请输出：\n1. 必备要求（Must-have）3-6 条，每条一句话\n2. 加分项（Nice-to-have）\n3. 这个岗位真正在考什么（3 条）\n4. 我的潜在风险点 / 会被挑战的地方\n5. 关键词清单（用于改简历）\n6. 结论：值得投 / 观望 / 不匹配，并说明原因';
  }
  if(scope === 'match' && o){
    var evList = evs.map(function(e,i){
      return (i+1)+'. ['+(e.type||'')+'/强度:'+(e.strength||'未评')+'] '+e.name+'\n   做了：'+(e.action||'')+'\n   结果：'+(e.result||'')+'\n   证明能力：'+(e.ability||'')+'\n   能力标签：'+(e.capabilityTags||'');
    }).join('\n');
    return head + '【任务】把 JD 要求和我的 Evidence 做匹配。\n\n【岗位】'+o.company+' · '+(o.role||'')+
      '\n【JD 要求】\n'+((o.reqs||[]).map(function(r){ return '- '+(r.level||'')+' '+r.text; }).join('\n')||'（未拆解）')+
      '\n\n【我的 Evidence 库】\n'+(evList||'（空）')+
      '\n\n请对每条 JD 要求输出：\n- 最匹配的 Evidence 编号\n- 匹配强度 Strong/Medium/Weak\n- 理由（一句话）\n- 面试时该怎么讲（一句话）\n若没有任何 Evidence 能匹配，明确写「未匹配」，不要硬凑。';
  }
  if(scope === 'gap' && o){
    var un = (o.reqs||[]).filter(function(r){ return !(o.matches||[]).some(function(m){ return m.reqId === r.id; }); });
    return head + '【任务】判断缺口类型。\n\n【岗位】'+o.company+' · '+(o.role||'')+
      '\n【未匹配的 JD 要求】\n'+(un.map(function(r){ return '- '+r.text; }).join('\n')||'（无）')+
      '\n\n【我的 Evidence 库】\n'+(evs.map(function(e){ return '- '+e.name+'：'+(e.ability||''); }).join('\n')||'（空') +
      '\n\n缺口类型只能四选一：\n- Presentation Gap：我其实具备，只是简历/表达没呈现\n- Weak Evidence：有相关经历但证据不足\n- Adjacent Skill：有相邻能力可迁移\n- True Gap：确实缺乏\n\n请对每条输出：类型 + 判断依据 + 最小成本的补法（不要一上来就建议我花半年学新东西）。';
  }
  if(scope === 'resume' && o){
    var ms = (o.matches||[]).map(function(m){
      var e = evs.filter(function(x){ return x.id === m.evId; })[0];
      return e ? ('- ['+(m.strength||'中')+'] '+e.name+' | 做了：'+(e.action||'')+' | 结果：'+(e.result||'')) : null;

    return head + '【任务】基于 Evidence 重写简历内容（不编造）。\n\n【目标岗位】'+o.company+' · '+(o.role||'')+
      '\n【JD 关键要求】\n'+((o.reqs||[]).map(function(r){ return '- '+r.text; }).join('\n')||'（未拆解）')+
      '\n\n【本岗位已匹配的 Evidence】\n'+(ms||'（尚未匹配）')+
      '\n\n请输出：\n1. 一段 3 行的个人摘要（贴合该岗位）\n2. 4-6 条简历 bullet，每条：动词开头 + 做了什么 + 方法/工具 + 量化结果（结果只能来自上面的 Evidence）\n3. 哪些 JD 关键词应该出现但还没出现在我的内容里\n4. 明确列出你「建议我补充的信息」（不要替我编）';
  }
  if(scope === 'interview' && o){
    var qs = listOf('questions').slice(0,10).map(function(q){ return '- '+q.question; }).join('\n');
    return head + '【任务】为这场面试做针对性准备。\n\n【岗位】'+o.company+' · '+(o.role||'')+' · 当前阶段：'+o.status+
      '\n【JD 要求】\n'+((o.reqs||[]).map(function(r){ return '- '+r.text; }).join('\n')||'（未拆解）')+
      '\n\n【我的 Evidence】\n'+(evs.map(function(e){ return '- '+e.name+'（'+(e.strength||'未评')+'）：'+(e.result||''); }).join('\n')||'（空）')+
      '\n\n【我以前被问过的问题】\n'+(qs||'（暂无）')+
      '\n\n请输出：\n1. 这场面试最可能被问的 8 个问题（按 JD 定制，不要通用模板）\n2. 每个问题建议用哪条 Evidence 回答\n3. 3 个我该主动抛出的亮点\n4. 2 个我要提前想好的风险问题应对\n5. 我该反问的 3 个问题';
  }
  if(scope === 'feedback'){
    var fbs = listOf('feedbacks').map(function(f){
      var oo = findById('opportunities', f.oppId);
      return '- ['+(f.date||'')+'] '+(oo?oo.company:'')+' / '+(f.channel||'')+'：'+(f.content||'');
    }).join('\n');
    return head + '【任务】从多条市场反馈里找共同模式。\n\n【我的全部反馈】\n'+(fbs||'（暂无反馈）')+
      '\n\n【当前漏斗】\n'+funnelData().map(function(f){ return f.name+'：'+f.v; }).join(' / ')+
      '\n\n请输出：\n1. 反复出现的信号（至少 2 条，要给出是哪几条反馈支撑的）\n2. 可以总结成的 Lesson（可迁移认知，2-3 条）\n3. 对应的 Strategy Update（我该调整什么策略）\n4. 接下来 1 周最该做的 3 个行动\n不要泛泛而谈，必须引用我上面的具体反馈。';
  }
  /* next */
  var acts = pendingActions().slice(0,8).map(function(x){ return '- '+x.opp.company+'（'+x.opp.status+'/'+(x.opp.priority||'')+'）：'+x.opp.nextAction+' | 截止 '+dueLabel(x.due); }).join('\n');
  return head + '【任务】帮我判断现在最值得做的下一步。\n\n【我的目标】'+((goal() && goal().text) || '（未设置）')+
    '\n\n【漏斗】\n'+funnelData().map(function(f){ return f.name+'：'+f.v; }).join(' / ')+
    '\n\n【进行中的 Next Action】\n'+(acts||'（无）')+
    '\n\n【未完成的 Gap Action】\n'+(listOf('actions').filter(function(a){ return a.status!=='已完成'; }).map(function(a){ return '- '+a.title+' | 优先级 '+(a.priority||'')+' | '+dueLabel(a.due); }).join('\n')||'（无')+
    '\n\n请输出：\n1. 现在最该做的 1 件事（唯一），及为什么（ROI 角度）\n2. 明确不该现在做的 2 件事\n3. 如果只能今天做 2 小时，怎么用\n只给判断，不要列一堆平铺选项。';
}

/* ---- V2：带子 Tab 的三个模块 ---- */
function subTabs(mod, tabs){
  var cur = state.tab[mod] || tabs[0].k;
  var h = '<div class="subtabs">';
  tabs.forEach(function(t){
    h += '<button class="subtab'+(cur===t.k?' active':'')+'" data-act="set-tab" data-m="'+mod+'" data-v="'+t.k+'">'+esc(t.t)+
         '<span class="n">'+t.n+'</span></button>';
  });
  return h + '</div>';
}
function pageHead(title, desc, btn){
  return '<div class="h-page"><div><h1 class="h-title">'+esc(title)+'</h1><div class="h-desc">'+esc(desc)+'</div></div>' +
    '<div style="margin-left:auto;display:flex;gap:6px;flex-wrap:wrap">'+(btn||'')+'</div></div>';
}

function actionListView(){
  var acts = listOf('actions');
  if(!acts.length) return '<div class="card"><div class="empty">'+ico('inbox')+'<p>还没有 Action</p>' +
    '<button class="btn btn-primary" data-act="action-add">'+ico('plus')+'新增 Action</button></div></div>';
  var over  = acts.filter(function(a){ return a.status !== '已完成' && isOverdue(a.due); });
  var doing = acts.filter(function(a){ return a.status === '进行中' && !isOverdue(a.due); });
  var todo  = acts.filter(function(a){ return a.status !== '已完成' && a.status !== '进行中' && !isOverdue(a.due); });
  var done  = acts.filter(function(a){ return a.status === '已完成'; });
  function grp(title, arr, color){
    if(!arr.length) return '';
    return '<div class="card" style="margin-bottom:12px"><div class="sub-head" style="color:'+color+'">'+esc(title)+' · '+arr.length+'</div>' +
      arr.map(function(a){ return actionRow(a, false); }).join('') + '</div>';
  }
  return grp('已逾期', over, 'var(--danger)') + grp('进行中', doing, 'var(--warn)') +
         grp('待开始', todo, 'var(--text-3)') + grp('已完成', done, '#12b76a');
}

function marketPathView(){
  var cos = listOf('companies');
  if(!cos.length) return '';
  var byCity = {}, order = [];
  cos.forEach(function(c){
    var k = c.city || '未填城市';
    if(!byCity[k]){ byCity[k] = {}; order.push(k); }
    var ik = c.industry || '未填行业';
    if(!byCity[k][ik]) byCity[k][ik] = [];
    byCity[k][ik].push(c);
  });
  var h = '<div class="card" style="margin-bottom:12px"><div class="sub-head">市场路径 · 城市 → 行业 → 企业</div>';
  order.forEach(function(city){
    h += '<div class="mp-city">'+ico('target')+esc(city)+'</div>';
    Object.keys(byCity[city]).forEach(function(ind){
      h += '<div class="mp-ind">'+esc(ind)+'</div><div class="mp-co">';
      byCity[city][ind].forEach(function(c){
        var n = linkedOpps(c.name).length;
        h += '<button class="btn btn-xs" data-act="s-edit" data-key="companies" data-id="'+esc(c.id)+'">'+esc(c.name)+(n?(' · '+n+' 个岗位'):'')+'</button>';
      });
      h += '</div>';
    });
  });
  return h + '</div>';
}

function simpleBody(cfg){
  var items = listOf(cfg.key);
  if(!items.length) return '<div class="card"><div class="empty">'+ico('inbox')+'<p>暂无记录</p>' +
    '<button class="btn btn-primary" data-act="s-add" data-key="'+cfg.key+'">'+ico('plus')+'新增一条</button></div></div>';
  var h = '<div class="grid '+(cfg.cols||'grid-2')+'">';
  items.forEach(function(it){ h += cfg.card(it); });
  return h + '</div>';
}

    '<div style="margin-left:auto"><button class="btn btn-primary" data-act="s-add" data-key="'+cfg.key+'">'+ico('plus')+'新增</button></div></div>';
  h += '<div class="placeholder-note">'+ico('alert')+'<span>'+esc(note)+'</span></div>';
  return h + simpleBody(cfg);

function simpleForm(cfg, item){
  var body = '';
  cfg.fields.forEach(function(f){
    var v = item ? item[f.k] : '';
    if(f.type === 'area') body += fArea(f.label, f.k, v, { rows:f.rows||3, ph:f.ph });

    body:body,
    foot:'<button class="btn" data-act="close-modal">取消</button>' +
         '<button class="btn btn-primary" data-act="s-save" data-key="'+cfg.key+'"'+(item?(' data-id="'+esc(item.id)+'"'):'')+'>保存</button>' });
