/* =========================================================
   事件层：所有交互 → 改数据 → refreshAll()（渲染函数之间不互相调用）
   ========================================================= */
function bindGlobal(){
  document.addEventListener('click', function(e){
    if(!e.target || !e.target.closest) return;
    var el = e.target.closest('[data-act]');
    if(!el) return;
    var act = el.getAttribute('data-act');
    var id  = el.getAttribute('data-id');
    var o   = id ? findById('opportunities', id) : null;

    if(/-del$/.test(act) && !el.dataset.confirmed){confirmBox('确认删除','删除后可用顶部“撤销上次修改”恢复最近一次修改。继续？',function(){el.dataset.confirmed='yes';el.click();delete el.dataset.confirmed;});return;}
    if(act === 'mask'){ if(e.target === el) closeModal(); return; }

    switch(act){
      /* --- 导航 / 全局 --- */
      case 'save-contribution': DB.meta.contribution=document.getElementById('contribution').value;saveAll();toast('已保存');return;
      case 'switch-mode': location.search=IS_DEMO?'?mode=personal':'?mode=demo';return;
      case 'undo': if(!undoSnapshot){toast('没有可撤销的修改');return;}var previous=undoSnapshot;DB=JSON.parse(previous);saveAll();undoSnapshot=null;state.selOpp=null;refreshAll();toast('已撤销上次修改');return;
      case 'demo-reset': if(IS_DEMO)confirmBox('重置演示','将替换当前 Demo 修改；个人数据不受影响。建议先备份。',function(){seedDemo();saveAll();state.selOpp=null;refreshAll();toast('演示已重置');});return;
      case 'nav':
        state.view = el.getAttribute('data-view'); state.selOpp = null; refreshAll(); return;
      case 'close-modal': closeModal(); return;
      case 'confirm-yes': closeModal(); if(_pendingConfirm){ var f=_pendingConfirm; _pendingConfirm=null; f(); } return;
      case 'export-json': exportJSON(); return;
      case 'import-json': document.getElementById('fileInput').click(); return;
      case 'reset-data':
        confirmBox('清空数据','将清空<b>全部</b>岗位、证据、面试与反馈记录（不可恢复）。建议先导出备份。确认继续？', function(){
          STORES.forEach(function(k){ if(k!=='meta') DB[k] = { items:[] }; });
          DB.meta.seeded = true; state.selOpp = null; saveAll(); refreshAll(); toast('已清空，可开始录入真实数据');
        }); return;
      case 'back-list': state.selOpp = null; refreshAll(); return;
      case 'toggle-sec': {
        var k = el.getAttribute('data-key');
        state.collapsed[k] = !state.collapsed[k]; refreshAll(); return;
      }
      case 'quick-add': case 'opp-new': oppForm(null); return;

      /* --- 岗位 --- */
      case 'open-opp': state.selOpp = id; state.view = 'opps'; refreshAll(); return;
      case 'opp-edit': if(o) oppForm(o); return;
      case 'opp-del':
        if(o) confirmBox('删除岗位','确定删除「'+esc(o.company)+' · '+esc(o.role||'')+'」？相关面试与反馈记录会保留但失去关联。', function(){
          removeItem('opportunities', id); if(state.selOpp===id) state.selOpp=null; refreshAll(); toast('已删除');
        }); return;
      case 'opp-save': {
        var d = readForm();
        if(!d.company || !d.role){ toast('请填写公司名称和岗位名称'); return; }
        if(id){ updateItem('opportunities', id, d); }
        else { var n = addItem('opportunities', {
          company:d.company, role:d.role, direction:d.direction, city:d.city, salary:d.salary, jd:d.jd,
          source:d.source, priority:d.priority, status:d.status||'收藏', contact:d.contact,
          resumeVersion:d.resumeVersion, appliedDate:d.appliedDate, nextAction:d.nextAction,
          nextDue:d.nextDue, result:d.result, reqs:[], matches:[]
        }); state.selOpp = n.id; state.view = 'opps'; }
        closeModal(); refreshAll(); toast('已保存'); return;
      }
      case 'edit-jd':
        if(o) openModal({ title:'JD 原文 · '+o.company, wide:true,
          body: fArea('JD 原文','jd',o.jd,{rows:16,ph:'整段粘贴招聘启事'}),
          foot:'<button class="btn" data-act="close-modal">取消</button><button class="btn btn-primary" data-act="jd-save" data-id="'+esc(id)+'">保存</button>' }); return;
      case 'jd-save': {
        var jd = readForm().jd;
        updateItem('opportunities', id, { jd:jd }); closeModal(); refreshAll(); toast('JD 已保存'); return;
      }

      /* --- JD 要求拆解 --- */
      case 'req-add': if(o) reqForm(o, null); return;
      case 'req-edit': {
        var rid = el.getAttribute('data-rid');
        var r = (o.reqs||[]).filter(function(x){ return x.id === rid; })[0];
        if(o && r) reqForm(o, r); return;
      }
      case 'req-save': {
        var fd = readForm();
        if(!fd.text){ toast('请填写要求内容'); return; }
        var arr = (o.reqs || []).slice();
        var rid2 = el.getAttribute('data-rid');
        if(rid2){ for(var i=0;i<arr.length;i++){ if(arr[i].id===rid2){ arr[i] = { id:rid2, text:fd.text, level:fd.level, note:fd.note }; } } }
        else arr.push({ id:uid(), text:fd.text, level:fd.level||'必备', note:fd.note });
        updateItem('opportunities', id, { reqs:arr }); closeModal(); refreshAll(); return;
      }
      case 'req-del': {
        var rid3 = el.getAttribute('data-rid');
        updateItem('opportunities', id, {
          reqs:(o.reqs||[]).filter(function(x){ return x.id !== rid3; }),
          matches:(o.matches||[]).filter(function(x){ return x.reqId !== rid3; })
        }); refreshAll(); return;
      }
      case 'req-bulk': {
        var lines = String(o.jd||'').split(/\n+/).map(function(s){ return s.replace(/^[\s\-•·*\d.、]+/,'').trim(); })
          .filter(function(s){ return s.length >= 5 && s.length <= 80; }).slice(0, 12);
        if(!lines.length){ toast('JD 里没找到可拆的行'); return; }
        var nr = lines.map(function(s){
          return { id:uid(), text:s, level:(/优先|加分|plus|熟悉.*更佳/i.test(s) ? '加分' : '必备'), note:'' };
        });
        updateItem('opportunities', id, { reqs:(o.reqs||[]).concat(nr) }); refreshAll(); toast('已导入 '+nr.length+' 条要求，请手动删掉无用项'); return;
      }

      /* --- 匹配 --- */
      case 'match-add': if(o) matchForm(o, { reqId: el.getAttribute('data-rid') }); return;
      case 'match-edit': {
        var mid = el.getAttribute('data-mid');
        var m = (o.matches||[]).filter(function(x){ return x.id === mid; })[0];
        if(o && m) matchForm(o, m); return;
      }
      case 'match-save': {
        var mfd = readForm();
        if(!mfd.evId){ toast('请选择一条 Evidence'); return; }
        var marr = (o.matches || []).slice();
        var mid2 = el.getAttribute('data-mid');
        if(mid2){ for(var j=0;j<marr.length;j++){ if(marr[j].id===mid2){ marr[j] = { id:mid2, reqId:mfd.reqId, evId:mfd.evId, strength:mfd.strength, note:mfd.note }; } } }
        else marr.push({ id:uid(), reqId:mfd.reqId, evId:mfd.evId, strength:mfd.strength||'中', note:mfd.note });
        updateItem('opportunities', id, { matches:marr }); closeModal(); refreshAll(); return;
      }
      case 'match-del': {
        var mid3 = el.getAttribute('data-mid');
        updateItem('opportunities', id, { matches:(o.matches||[]).filter(function(x){ return x.id !== mid3; }) }); refreshAll(); return;
      }
      case 'gap-from-req': {
        var rid4 = el.getAttribute('data-rid');
        var rq = (o.reqs||[]).filter(function(x){ return x.id === rid4; })[0];
        if(rq) addItem('gaps', { title:'缺少：'+rq.text, gapType:'True Gap', oppId:id, category:'硬技能',
          source:o.company+' · JD 未匹配', severity:'高',
          action:'判断是「没做」还是「做了没写」——先补一段能证明「'+rq.text+'」的经历或作品',
          due:shiftDays(todayStr(),14), status:'待开始' });
        toast('已转入「能力缺口与行动」'); refreshAll(); return;
      }
      case 'copy-match': {
        var evs2 = listOf('evidence');
        var txt = ['【'+o.company+' · '+(o.role||'')+'】证据匹配摘要'];
        (o.reqs||[]).forEach(function(r){
          var ms = (o.matches||[]).filter(function(x){ return x.reqId === r.id; });
          txt.push('· '+(r.level||'')+' '+r.text);
          if(!ms.length) txt.push('    → 未匹配（缺口）');
          ms.forEach(function(m){
            var ev = evs2.filter(function(x){ return x.id === m.evId; })[0];
            txt.push('    → ['+(m.strength||'中')+'] '+(ev?ev.name:'已删除')+(m.note?(' — '+m.note):''));
          });
        });
        copyText(txt.join('\n')); return;
      }

      /* --- 状态推进 --- */
      case 'mark-applied': {
        var patch = { appliedDate: todayStr() };
        if(stageIdx(o.status) < 3) patch.status = '已投递';
        updateItem('opportunities', id, patch); refreshAll(); toast('已标记为今日投递'); return;
      }
      case 'next-stage': {
        var i2 = stageIdx(o.status);
        if(i2 < 0){ toast('当前是终态（'+o.status+'），请手动改状态'); return; }
        if(i2 >= STATUS_FLOW.length-1){ toast('已经是 Offer 了'); return; }
        updateItem('opportunities', id, { status: STATUS_FLOW[i2+1] }); refreshAll(); toast('已推进到 '+STATUS_FLOW[i2+1]); return;
      }
      case 'next-edit': if(o) nextActionForm(o); return;
      case 'na-save': {
        var nd = readForm();
        updateItem('opportunities', id, { nextAction:nd.act, nextDue:nd.due }); closeModal(); refreshAll(); toast('Next Action 已更新'); return;
      }
      case 'next-save': {
        var a = document.getElementById('na_act'), d2 = document.getElementById('na_due');
        updateItem('opportunities', id, { nextAction:a?a.value:'', nextDue:d2?d2.value:'' }); refreshAll(); toast('Next Action 已保存'); return;
      }
      case 'set-due': {
        var dd = parseInt(el.getAttribute('data-d'), 10) || 0;
        updateItem('opportunities', id, { nextDue: shiftDays(todayStr(), dd) }); refreshAll(); return;
      }
      case 'done-next':
        updateItem('opportunities', id, { nextAction:'', nextDue:'' });
        refreshAll(); if(o) nextActionForm(findById('opportunities', id));
        toast('已完成，设置下一个 Next Action'); return;

      /* --- 简历 --- */
      case 'resume-new': resumeForm(null); return;
      case 'resume-save': {
        var rd = readForm();
        if(!rd.name){ toast('请填写版本名称'); return; }
        var rid5 = el.getAttribute('data-id');
        if(rid5) updateItem('resumes', rid5, { name:rd.name, targetRole:rd.targetRole, version:rd.version, summary:rd.summary, notes:rd.notes });
        else addItem('resumes', { name:rd.name, targetRole:rd.targetRole, version:rd.version, summary:rd.summary, notes:rd.notes, evidenceIds:[] });
        closeModal(); refreshAll(); toast('已保存'); return;
      }
      case 'resume-pick': {
        var r2 = findById('resumes', id);
        if(r2) pickEvidenceForm(r2); return;
      }
      case 'pick-save': {
        var picks = [];
        var boxes = document.querySelectorAll('#modalRoot input[name=evpick]');
        for(var p=0;p<boxes.length;p++){ if(boxes[p].checked) picks.push(boxes[p].value); }
        updateItem('resumes', id, { evidenceIds: picks }); closeModal(); refreshAll(); toast('已挂载 '+picks.length+' 条 Evidence'); return;
      }

      /* --- 面试 / 反馈 --- */
      case 'iv-add': if(o) ivForm({ oppId:id, date:todayStr() }); return;
      case 'iv-edit': { var iv = findById('interviews', el.getAttribute('data-iv')); if(iv) ivForm(iv); return; }
      case 'iv-save': {
        var idata = readForm(); if(!idata.oppId || !idata.round || !idata.date){toast('请选择岗位、轮次和日期');return;} var ivid = el.getAttribute('data-iv');
        if(ivid) updateItem('interviews', ivid, idata); else addItem('interviews', idata);
        closeModal(); refreshAll(); toast('面试记录已保存'); return;
      }
      case 'iv-del': removeItem('interviews', el.getAttribute('data-iv')); refreshAll(); return;
      case 'fb-add': if(o) fbForm({ oppId:id, date:todayStr() }); return;
      case 'fb-edit': { var fb2 = findById('feedbacks', el.getAttribute('data-fb')); if(fb2) fbForm(fb2); return; }
      case 'fb-save': {
        var fdata = readForm(); if(!fdata.oppId || !fdata.content){toast('请选择岗位并填写反馈事实');return;} var fbid = el.getAttribute('data-fb');
        if(fbid) updateItem('feedbacks', fbid, fdata); else addItem('feedbacks', fdata);
        closeModal(); refreshAll(); toast('反馈已保存'); return;
      }
      case 'fb-del': removeItem('feedbacks', el.getAttribute('data-fb')); refreshAll(); return;
      case 'gap-from-fb': {
        var fb3 = findById('feedbacks', el.getAttribute('data-fb'));
        if(fb3){
          var oo = findById('opportunities', fb3.oppId);
          addItem('gaps', { title: fb3.lesson || ('待改进：'+(fb3.content||'').slice(0,20)), gapType:'Presentation Gap', oppId: fb3.oppId || '',
            category:'表达与面试', source:(oo?oo.company:'')+' · '+(fb3.channel||'反馈'), severity:'中',

  document.addEventListener('change', function(e){
    var el = e.target;

    var id = el.getAttribute('data-id');

    else if(t === 'opp-filter'){ state.oppFilter[el.getAttribute('data-f')] = el.value; refreshAll(); }

  document.getElementById('fileInput').addEventListener('change', function(e){

    fr.onload = function(){
      try{
        var candidate=validateBackup(JSON.parse(fr.result));

    fr.onerror=function(){toast('读取文件失败，原数据未变');}; if(f.size>10*1024*1024){toast('文件超过 10MB');e.target.value='';return;} fr.readAsText(f);
  });
}

function refocusOppQ(){

function copyText(txt){
  confirmBox('复制前检查隐私','请确认已检查姓名、联系方式、JD 内部信息等隐私。外部 AI 由你自行选择，演示内容不能作为真实经历。',function(){
    function fallback(){var ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';document.body.appendChild(ta);ta.select();try{if(!document.execCommand('copy'))throw Error('copy');toast('已复制到剪贴板');}catch(e){openModal({title:'复制失败，请手动选择',body:'<textarea rows="14">'+esc(txt)+'</textarea>',foot:'<button class="btn" data-act="close-modal">关闭</button>'});}finally{ta.remove();}}
    if(navigator.clipboard && navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(function(){toast('已复制到剪贴板');},fallback);else fallback();
  });
}

function exportJSON(){
  var out = {}, n = 0;
  STORES.forEach(function(k){ out[k] = DB[k] || { items:[] }; n += (out[k].items||[]).length; });
  var blob = new Blob([JSON.stringify(out, null, 2)], { type:'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'job-search-os-backup-' + todayStr() + '.json';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); document.body.removeChild(a); }, 400);
  toast('已导出备份（'+n+' 条记录）');
}

function projectCase(){return '<article class="card card-pad case-copy"><h1>Job Search OS · Project Case Study</h1><p>个人求职工作台 V1.1 · 静态网页 / 本地优先 / 无需注册</p><h2>背景与目标用户</h2><p>面向在多个平台投递多个岗位的求职者。信息分散时，JD、个人能力证据和面试反馈难以形成关联。</p><h2>产品思路与已实现功能</h2><p>用岗位 ID 串联 JD 要求、Evidence、投递状态、面试反馈和后续行动。工作台将下一步行动放在首页。</p><ol><li>岗位与 JD：逐条拆解要求、关联证据与识别缺口。</li><li>证据库与简历：复用已有材料，保留证据来源。</li><li>面试与反馈：记录问题，将复盘转为能力缺口与行动。</li><li>数据管理：本地保存、JSON 备份、覆盖导入与单步撤销。</li><li>Copilot：按现有材料组装提示词，复制到外部 AI；本工具不调用模型 API。</li></ol><button class="btn btn-primary" data-act="nav" data-view="opps">体验岗位闭环</button><h2>技术实现与数据边界</h2><p>原生 HTML、CSS、JavaScript 单文件；localStorage 保存，JSON 备份，无数据库、登录或付费 API。V1.1 使用 AI 辅助编程。Demo 和个人模式按存储键隔离。隐私数据仍可被同源脚本及本机用户读取，请勿在共享电脑录入敏感信息。</p><h2>验证与局限</h2><p>功能是否通过测试，以随源码提供的 TEST_REPORT.md 为准。尚未验证实际求职转化效果、长期使用效果或多用户需求。演示内容不代表真实个人经历与业绩。</p><p>漏斗要求各先行阶段均有明确记录；跳阶段或旧记录历史缺失会导致完整链队列少于实际经历人数。这是保守统计，不是全部历史活动统计。当前状态分布独立展示。</p><h2>个人贡献（作者填写）</h2><p>请在下方填写真实需求分析、设计、开发及测试工作；不应将 AI 生成内容自动当作个人贡献。</p><textarea id="contribution" rows="5" aria-label="个人贡献">'+esc(DB.meta.contribution||'')+'</textarea><button class="btn" data-act="save-contribution">保存贡献说明到当前模式</button><h2>下一版规划</h2><p>历史阶段补录、多设备迁移体验、基于真实使用访谈的验证与迭代。没有效率提升或用户规模的已验证指标。</p></article>';}
function boot(){
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();if(e.key==='Tab'){var m=document.querySelector('.modal');if(m){var a=Array.from(m.querySelectorAll('button,input,textarea,select,a[href]')).filter(function(x){return !x.disabled && x.offsetParent!==null;});var first=a[0],last=a[a.length-1];if(e.shiftKey && document.activeElement===first){last.focus();e.preventDefault();}else if(!e.shiftKey && document.activeElement===last){first.focus();e.preventDefault();}}}});
  try{loadAll();}catch(e){document.getElementById('content').textContent='读取本地数据失败：'+e.message+'。原存储未被修改，请保留浏览器数据并从已有备份恢复。';return;}
  bindGlobal();
  refreshAll();
}
if(document.readyState === 'loading'){ document.addEventListener('DOMContentLoaded', boot); } else { boot(); }
